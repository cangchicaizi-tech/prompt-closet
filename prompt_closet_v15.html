<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt Closet</title>
<style>
*{box-sizing:border-box}
:root{--ink:#1e1b2e;--sub:#7a7585;--line:#e6dfd6;--ac1:#4b3f7a;--ac2:#b0688f;--grad:linear-gradient(135deg,var(--ac1),var(--ac2))}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(900px 500px at 0% -10%,#ece3f6 0,transparent 60%),radial-gradient(800px 480px at 100% 0,#fbe6df 0,transparent 55%),#f6f3ef;background-attachment:fixed;color:var(--ink);letter-spacing:.01em;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
main{max-width:900px;margin:auto;padding:22px 16px 80px}
.card{background:#ffffffe6;border:1px solid #fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 10px 32px #4b3f7a14}
.hero{background:var(--grad);color:#fff;padding:22px 20px;box-shadow:0 14px 36px #4b3f7a40}
.hero .sub{color:#ffffffcc}
h1{margin:0 0 4px;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:30px;font-weight:600;letter-spacing:.06em}
h2{display:flex;align-items:center;gap:8px;font-size:15px;letter-spacing:.06em;margin:0 0 11px}
h2::before{content:"";width:5px;height:16px;border-radius:3px;background:var(--grad)}
.sub{font-size:13px;color:var(--sub)}.muted{font-size:12px;color:var(--sub);margin:2px 0 8px}.shuffle-note{font-size:12px;color:var(--sub)}
input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:14px;font-size:16px;background:#fffdfb;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{outline:none;border-color:var(--ac2);box-shadow:0 0 0 4px #b0688f22}
textarea{min-height:120px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:16px;line-height:1.55}
#output{min-height:150px}
.manualbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding:8px 12px;border-radius:14px;background:#f7ecf2;font-size:12px;color:var(--ac1)}.manualbar .mini{white-space:nowrap}
button{cursor:pointer;font-family:inherit;color:var(--ink)}button:active{transform:scale(.96)}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.btn,.style,.cat-tab,.mini,.chip{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px;transition:all .15s ease}
.mini{padding:7px 12px;font-size:13px}.chip{padding:5px 10px;font-size:12px;background:#f4f1fa;border-color:#e0d9f0}
.btn:hover,.style:hover,.cat-tab:hover,.mini:hover{border-color:var(--ac2)}
.btn.on,.style.on,.cat-tab.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 5px 14px #4b3f7a40}
.mini.accent{background:var(--grad);border-color:transparent;color:#fff}
.style{font-weight:600;white-space:nowrap}
.stylebox{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.stylebox::-webkit-scrollbar{display:none}
.style-elements{margin-top:12px}.style-group{margin-top:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.primary,.danger{padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600}
.primary{background:var(--grad);color:#fff;border:0;box-shadow:0 6px 16px #4b3f7a40}
.danger{background:#fff;border:1px solid var(--line);color:var(--sub)}
.shufflebtns{display:flex;gap:8px;margin-top:12px}.shufflebtns .primary{flex:1;padding:12px 8px;white-space:nowrap}
.sub-menu{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}.sub-tab{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#faf8f6;font-size:13px;transition:all .15s ease}.sub-tab.on{background:#f1e9f6;border-color:var(--ac2);color:var(--ac1);font-weight:600}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.cardhead h2{margin:0}
.cat-tab{flex:0 0 auto;white-space:nowrap}
.category-menu-wrap,.person-menu-wrap,.creature-menu-wrap{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;margin:0 0 10px;scrollbar-width:none}
.category-menu-wrap::-webkit-scrollbar,.person-menu-wrap::-webkit-scrollbar,.creature-menu-wrap::-webkit-scrollbar{display:none}
.category-menu{display:inline-flex;gap:8px;min-width:max-content}
.category-panel{display:none}.category-panel.open{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.badge{display:inline-block;min-width:18px;margin-left:7px;padding:1px 6px;border-radius:999px;background:var(--grad);color:#fff;font-size:11px;line-height:16px}
.cat-tab.on .badge{background:#ffffff40}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid #0003}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip.personchip{background:#f7ecf2;border-color:#ecc9db}
.nav{display:flex;gap:8px;margin-top:16px}
.navbtn{flex:1;padding:10px;border-radius:999px;border:1px solid #ffffff55;background:#ffffff26;color:#fff;font-weight:600;font-size:14px}
.navbtn.on{background:#fff;color:var(--ac1)}.navbtn .badge{background:#ffffff40}.navbtn.on .badge{background:var(--grad)}
.saverow{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}.saverow input{flex:1}.saverow .primary{white-space:nowrap}
.saved-item{border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;background:#fffdfb}
.saved-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}.saved-top strong{font-size:16px}
.saved-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.empty{padding:22px 8px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--grad);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:9999;box-shadow:0 8px 22px #4b3f7a55}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><main>
<div class="card hero"><h1>Prompt Closet</h1><div class="sub">服・方向性・ポーズを選んで、コピペ用プロンプトを作成</div>
<div class="nav"><button id="navMake" class="navbtn on" onclick="showView('make')">🎨 つくる</button><button id="navSaved" class="navbtn" onclick="showView('saved')">⭐ 保存済み<span id="savedCount" class="badge" hidden></span></button></div></div>

<div id="viewMake">
<div class="card"><input id="search" placeholder="登録プロンプトを検索…"></div>
<div class="card"><h2 style="margin-bottom:4px">おまかせコーデ</h2><div class="shuffle-note">アウター・トップス・ボトムス・小物から組み合わせ。性別も自動で選びます。セット服と方向性は除外、服以外の選択は残ります。</div><div class="shufflebtns"><button class="primary" onclick="shuffleOutfit('male')">🎲 男性おまかせ</button><button class="primary" onclick="shuffleOutfit('female')">🎲 女性おまかせ</button></div></div>
<div class="card"><div class="cardhead"><h2>人物</h2><div class="actions" style="margin:0"><button class="mini" onclick="randomPerson()">🎲 髪ランダム</button><button class="mini" onclick="clearPerson()">人物をクリア</button></div></div><div id="personBody"></div></div>
<div class="card"><div class="cardhead"><h2>人外パーツ</h2><div class="actions" style="margin:0"><button class="mini" onclick="clearCreature()">クリア</button></div></div><div id="creatureBody"></div></div>
<div id="styleCard" class="card"><h2>方向性</h2><div id="styles" class="stylebox"></div><div id="styleElements" class="style-elements"></div></div>
<div id="categories"></div>
<div class="card"><h2>生成プロンプト</h2><div id="chips" class="chips"></div><textarea id="output" placeholder="ここに直接入力・貼り付けもできます" spellcheck="false"></textarea>
<div id="manualBar" class="manualbar" hidden><span>✎ 手動編集中（ボタンを変えても編集内容は残ります）</span><button class="mini" onclick="resetManual()">自動生成に戻す</button></div>
<div class="actions"><button class="primary" onclick="copyPrompt()">コピー</button><button class="danger" onclick="clearAll()">選択をクリア</button></div>
<div class="saverow"><input id="tplName" placeholder="この組み合わせに名前を付けて保存"><button class="primary" onclick="saveTemplate()">⭐ 保存</button></div></div>
</div>

<div id="viewSaved" hidden>
<div class="card"><h2>保存した組み合わせ</h2><div class="muted">「読み込む」で「つくる」画面に戻って続きから編集できます。</div><div id="savedList"></div></div>
<div class="card"><h2>バックアップ</h2><div class="muted">保存データはこのブラウザの中だけに入っています。機種変更やブラウザのデータ消去に備えて、書き出したテキストを控えておくと安心です。</div>
<textarea id="backup" placeholder="書き出し／取り込み用テキスト"></textarea>
<div class="actions"><button class="primary" onclick="exportTemplates()">書き出す（コピー）</button><button class="danger" onclick="importTemplates()">取り込む</button></div></div>
</div>
</main><div id="toast" class="toast"></div>

const PSINGLE=new Set(["肌色","髪色","長さ","前髪・分け目","差し色"]);
const PNOTE={"差し色":"メッシュ等の2色目"};
const PTABS=["性別",...Object.keys(PERSON)];
const CHARACTER_PROMPTS={male:"1boy, solo male, adult male",female:"1girl, solo female, adult female"};
const BASE_PROMPT="masterpiece, best quality, highly detailed, clean illustration, detailed face, detailed facial features, natural proportions, coherent details";
const SHUFFLE_CATS=["アウター","トップス","ボトムス","小物"];
const SHUFFLE_COUNTS={"アウター":1,"トップス":1,"ボトムス":1,"小物":2};
const TPL_KEY="promptClosetTemplates";
const esc=s=>String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
const escHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const flat=cat=>{const v=DATA[cat]||[];return Array.isArray(v)?v:Object.values(v).flat();};
const JP={};
Object.keys(DATA).forEach(c=>flat(c).forEach(x=>{if(!JP[x[1]])JP[x[1]]=x[0]}));
Object.values(STYLES).forEach(a=>a.forEach(x=>{if(!JP[x[1]])JP[x[1]]=x[0]}));
Object.values(CREATURE).forEach(a=>a.forEach(x=>{if(!JP[x[1]])JP[x[1]]=x[0]}));

let selected=new Set(),selectedStyles=new Set(),characterType=null,openCategory=null,openPerson=null,openCreature=null,tplList=[],manual=false,lastAuto=[];
const psel={};Object.keys(PERSON).forEach(k=>psel[k]=new Set());

/* ---------- toast / clipboard ---------- */
function showToast(msg){
  const t=document.getElementById("toast");t.textContent=msg;
  t.classList.remove("show");void t.offsetWidth;t.classList.add("show");
  clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove("show"),1500);
}
async function copyText(text){
  if(!text)return false;
  try{await navigator.clipboard.writeText(text);return true;}catch(e){}
  try{const ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();return ok;}catch(e){return false;}
}
async function copyPrompt(){
  const text=document.getElementById("output").value;if(!text)return;
  showToast(await copyText(text)?"コピーしたよ！":"コピーできなかった…");
}

/* ---------- person ---------- */
const personOptions=g=>g==="性別"?GENDER.map(x=>[x[0],x[1],null]):PERSON[g];
const personOn=(g,en)=>g==="性別"?characterType===en:psel[g].has(en);
const personCount=g=>g==="性別"?(characterType?1:0):psel[g].size;
function labelOf(g,en){const it=personOptions(g).find(x=>x[1]===en);return it?it[0]:en;}
function personClick(g,en){if(g==="性別")setCharacter(en);else togglePerson(g,en);}
function setCharacter(type){characterType=(characterType===type)?null:type;render();}
function togglePerson(g,en){
  const set=psel[g];
  if(set.has(en))set.delete(en);
  else{if(PSINGLE.has(g))set.clear();set.add(en);}
  render();
}
function toggleTab(g){openPerson=(openPerson===g)?null:g;render();}
function clearPerson(){Object.keys(PERSON).forEach(g=>psel[g].clear());characterType=null;render();}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function randomPerson(){
  ["髪色","長さ","髪型","前髪・分け目","差し色","アレンジ","髪飾り"].forEach(g=>psel[g].clear());
  psel["髪色"].add(pick(PERSON["髪色"])[1]);
  psel["長さ"].add(pick(PERSON["長さ"])[1]);
  psel["髪型"].add(pick(PERSON["髪型"])[1]);
  if(Math.random()<.6)psel["前髪・分け目"].add(pick(PERSON["前髪・分け目"])[1]);
  render();
}
function renderPerson(q){
  const box=document.getElementById("personBody");
  const old=box.querySelector(".person-menu-wrap");const sc=old?old.scrollLeft:0;
  const menu=PTABS.map(g=>{const n=personCount(g);return `<button class="cat-tab ${openPerson===g?"on":""}" onclick="toggleTab('${esc(g)}')">${g}${n?`<span class="badge">${n}</span>`:""}</button>`;}).join("");
  const panels=PTABS.map(g=>{
    const arr=personOptions(g).filter(x=>!q||x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));
    const note=g==="性別"?"1つ選択":(PNOTE[g]||(PSINGLE.has(g)?"1つ選択":"複数OK"));
    const btns=arr.map(x=>{
      const dot=x[2]?`<span class="dot" style="background:${x[2]}"></span>`:"";
      return `<button class="btn ${personOn(g,x[1])?"on":""}" onclick="personClick('${esc(g)}','${esc(x[1])}')">${dot}${x[0]}</button>`;
    }).join("");
    return `<div class="category-panel ${openPerson===g?"open":""}"><div class="muted">${g} · ${note} · ${arr.length}件</div><div class="grid">${btns}</div></div>`;
  }).join("");
  box.innerHTML=`<div class="person-menu-wrap"><div class="category-menu">${menu}</div></div>${panels}`;
  const nw=box.querySelector(".person-menu-wrap");if(nw)nw.scrollLeft=sc;
}

/* ---------- creature parts ---------- */
const CTABS=Object.keys(CREATURE);
const creatureCount=g=>CREATURE[g].filter(x=>selected.has(x[1])).length;
function toggleCreatureTab(g){openCreature=(openCreature===g)?null:g;render();}
function clearCreature(){CTABS.forEach(g=>CREATURE[g].forEach(x=>selected.delete(x[1])));render();}
function renderCreature(q){
  const box=document.getElementById("creatureBody");
  const old=box.querySelector(".creature-menu-wrap");const sc=old?old.scrollLeft:0;
  const menu=CTABS.map(g=>{const n=creatureCount(g);return `<button class="cat-tab ${openCreature===g?"on":""}" onclick="toggleCreatureTab('${esc(g)}')">${g}${n?`<span class="badge">${n}</span>`:""}</button>`;}).join("");
  const panels=CTABS.map(g=>{
    const arr=CREATURE[g].filter(x=>!q||x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));
    return `<div class="category-panel ${openCreature===g?"open":""}"><div class="muted">${g} · 複数OK · ${arr.length}件</div><div class="grid">${arr.map(x=>itemBtn(x[0],x[1])).join("")}</div></div>`;
  }).join("");
  box.innerHTML=`<div class="creature-menu-wrap"><div class="category-menu">${menu}</div></div>${panels}`;
  const nw=box.querySelector(".creature-menu-wrap");if(nw)nw.scrollLeft=sc;
}

/* ---------- outfit ---------- */
const itemBtn=(jp,en)=>`<button class="btn ${selected.has(en)?"on":""}" onclick="toggle('${esc(en)}')">${jp}</button>`;
const openSub={};
function toggleSub(cat,sub){openSub[cat]=sub;render();}
function panelHtml(cat,q,match){
  const open=openCategory===cat?"open":"";
  const v=DATA[cat]||[];
  const grid=arr=>`<div class="grid">${arr.map(x=>itemBtn(x[0],x[1])).join("")}</div>`;
  if(Array.isArray(v)){const arr=v.filter(match);return `<div class="category-panel ${open}"><div class="muted">${cat} · ${arr.length}件</div>${grid(arr)}</div>`;}
  if(q){const arr=flat(cat).filter(match);return `<div class="category-panel ${open}"><div class="muted">${cat} · 検索結果 ${arr.length}件</div>${grid(arr)}</div>`;}
  const subs=Object.keys(v);
  const cur=subs.includes(openSub[cat])?openSub[cat]:subs[0];
  const tabs=subs.map(s=>{const n=v[s].filter(x=>selected.has(x[1])).length;return `<button class="sub-tab ${s===cur?"on":""}" onclick="toggleSub('${esc(cat)}','${esc(s)}')">${s}${n?`<span class="badge">${n}</span>`:""}</button>`;}).join("");
  return `<div class="category-panel ${open}"><div class="sub-menu">${tabs}</div><div class="muted">${cat} › ${cur} · ${v[cur].length}件</div>${grid(v[cur])}</div>`;
}
function toggleCategory(cat){openCategory=(openCategory===cat)?null:cat;render();}
function shuffleArray(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleOutfit(g){
  const male=(g==="male");
  for(const cat of SHUFFLE_CATS)flat(cat).forEach(x=>selected.delete(x[1]));
  for(const cat of SHUFFLE_CATS){
    let pool=flat(cat);
    if(cat==="小物")pool=pool.filter(x=>!["guitar","cake","parfait"].includes(x[1]));
    if(male)pool=pool.filter(x=>x[2]!=="f");
    shuffleArray(pool).slice(0,SHUFFLE_COUNTS[cat]||1).forEach(x=>selected.add(x[1]));
  }
  characterType=g;
  render();
}
function toggle(en){if(selected.has(en))selected.delete(en);else selected.add(en);render();}
function toggleStyle(style){
  if(selectedStyles.has(style)){selectedStyles.delete(style);(STYLES[style]||[]).forEach(x=>selected.delete(x[1]));}
  else{selectedStyles.add(style);(STYLES[style]||[]).forEach(x=>selected.add(x[1]));}
  render();
}

/* ---------- prompt building ---------- */
function validP(g,arr){
  let a=(arr||[]).filter(en=>PERSON[g].some(x=>x[1]===en));
  return PSINGLE.has(g)?a.slice(0,1):a;
}
function currentState(){
  return {styles:[...selectedStyles],items:[...selected],character:characterType,hair:Object.fromEntries(Object.keys(PERSON).map(g=>[g,[...psel[g]]])),custom:manual?document.getElementById("output").value:undefined};
}
function buildTags(t){
  const chara=CHARACTER_PROMPTS[t.character];
  const person=Object.keys(PERSON).flatMap(g=>validP(g,t.hair&&t.hair[g]));
  const styles=(t.styles||[]).map(s=>(DATA["方向性"].find(x=>x[0]===s)||[])[1]).filter(Boolean);
  return [...(chara?[chara]:[]),...person,...styles,...(t.items||[]),...(chara?[BASE_PROMPT]:[])];
}
function tagLabels(t){
  const out=[];
  if(CHARACTER_PROMPTS[t.character])out.push(labelOf("性別",t.character));
  Object.keys(PERSON).forEach(g=>validP(g,t.hair&&t.hair[g]).forEach(en=>out.push(labelOf(g,en))));
  (t.styles||[]).forEach(s=>out.push(s));
  (t.items||[]).forEach(en=>out.push(JP[en]||en));
  if(t.custom)out.push("✎手動編集あり");
  return out;
}
function renderChips(){
  const box=document.getElementById("chips");let h="";
  if(characterType)h+=`<button class="chip personchip" onclick="setCharacter('${esc(characterType)}')">${labelOf("性別",characterType)} ×</button>`;
  for(const g of Object.keys(PERSON))for(const en of psel[g])
    h+=`<button class="chip personchip" onclick="togglePerson('${esc(g)}','${esc(en)}')">${g==="差し色"?"差し色:":""}${labelOf(g,en)} ×</button>`;
  for(const en of selected)h+=`<button class="chip" onclick="toggle('${esc(en)}')">${JP[en]||en} ×</button>`;
  box.innerHTML=h||'<span class="muted">未選択</span>';
}
const tokz=t=>String(t).split(",").map(x=>x.trim()).filter(Boolean);
function msDiff(a,b){
  const c=new Map();b.forEach(t=>c.set(t,(c.get(t)||0)+1));
  const out=[];a.forEach(t=>{const n=c.get(t)||0;if(n>0)c.set(t,n-1);else out.push(t);});
  return out;
}
function mergeManual(cur,removed,added){
  const QTOK=tokz(BASE_PROMPT);
  const charaSet=new Set(Object.values(CHARACTER_PROMPTS).flatMap(tokz));
  const qSet=new Set(QTOK);
  removed.forEach(t=>{const i=cur.indexOf(t);if(i>=0)cur.splice(i,1);});
  const front=[],mid=[],back=[];
  added.forEach(t=>{
    if(cur.includes(t))return;
    if(charaSet.has(t))front.push(t);else if(qSet.has(t))back.push(t);else mid.push(t);
  });
  let end=cur.length;
  for(let i=cur.length-QTOK.length;QTOK.length&&i>=0;i--){if(QTOK.every((t,k)=>cur[i+k]===t)){end=i;break;}}
  cur.splice(end,0,...mid);
  return [...front,...cur,...back];
}
function updateManualUI(){document.getElementById("manualBar").hidden=!manual;}
function resetManual(){manual=false;update();}
function update(){
  const out=document.getElementById("output");
  const newA=tokz(buildTags(currentState()).join(", "));
  if(!manual){
    out.value=newA.join(", ");
  }else{
    const removed=msDiff(lastAuto,newA),added=msDiff(newA,lastAuto);
    if(removed.length||added.length)out.value=mergeManual(tokz(out.value),removed,added).join(", ");
  }
  lastAuto=newA;
  renderChips();updateManualUI();
}
function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const match=x=>!q||x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q);

  const styleBox=document.getElementById("styles");const styleScroll=styleBox.scrollLeft;
  styleBox.innerHTML=DATA["方向性"].filter(match).map(x=>`<button class="style ${selectedStyles.has(x[0])?"on":""}" onclick="toggleStyle('${esc(x[0])}')">${x[0]}</button>`).join("");
  styleBox.scrollLeft=styleScroll;

  const cats=Object.keys(DATA).filter(c=>c!=="方向性");
  const menuWrap=document.querySelector("#categories .category-menu-wrap");const menuScroll=menuWrap?menuWrap.scrollLeft:0;
  const menu=cats.map(cat=>{
    const n=flat(cat).filter(x=>selected.has(x[1])).length;
    return `<button class="cat-tab ${openCategory===cat?"on":""}" onclick="toggleCategory('${esc(cat)}')">${cat}${n?`<span class="badge">${n}</span>`:""}</button>`;
  }).join("");
  const panels=cats.map(cat=>{
    return panelHtml(cat,q,match);
  }).join("");
  document.getElementById("categories").innerHTML=`<div class="card"><div class="category-menu-wrap"><div class="category-menu">${menu}</div></div>${panels}</div>`;
  const nm=document.querySelector("#categories .category-menu-wrap");if(nm)nm.scrollLeft=menuScroll;

  let styleHtml="";
  for(const style of selectedStyles){
    const arr2=(STYLES[style]||[]).filter(match);
    styleHtml+=`<div class="style-group"><strong>${style} の要素</strong><div class="grid" style="margin-top:6px">${arr2.map(x=>itemBtn(x[0],x[1])).join("")}</div></div>`;
  }
  document.getElementById("styleElements").innerHTML=styleHtml;

  renderPerson(q);
  renderCreature(q);
  update();
  updateSavedCount();
}
function clearAll(){
  selected.clear();selectedStyles.clear();
  Object.keys(PERSON).forEach(g=>psel[g].clear());
  characterType=null;openCategory=null;openPerson=null;openCreature=null;manual=false;
  render();
}

/* ---------- saved combinations ---------- */
function getTpls(){try{return JSON.parse(localStorage.getItem(TPL_KEY)||"{}")||{};}catch(e){return {};}}
function setTpls(t){try{localStorage.setItem(TPL_KEY,JSON.stringify(t));return true;}catch(e){showToast("保存できませんでした");return false;}}
function updateSavedCount(){
  const n=Object.keys(getTpls()).length;const el=document.getElementById("savedCount");
  el.textContent=n;el.hidden=!n;
}
function showView(v){
  document.getElementById("viewMake").hidden=(v!=="make");
  document.getElementById("viewSaved").hidden=(v!=="saved");
  document.getElementById("navMake").classList.toggle("on",v==="make");
  document.getElementById("navSaved").classList.toggle("on",v==="saved");
  if(v==="saved")renderSaved();
  window.scrollTo({top:0,behavior:"smooth"});
}
function saveTemplate(){
  const input=document.getElementById("tplName");const name=input.value.trim();
  if(!name){showToast("名前を入れてね");input.focus();return;}
  const st=currentState();
  if(!buildTags(st).length&&!st.custom){showToast("まだ何も選ばれていないよ");return;}
  const tpls=getTpls();
  if(tpls[name]&&!confirm(`「${name}」は保存済みです。上書きしますか？`))return;
  delete tpls[name];tpls[name]={...st,saved:Date.now()};
  if(!setTpls(tpls))return;
  input.value="";updateSavedCount();showToast("保存したよ！⭐");
}
function renderSaved(){
  const tpls=getTpls();
  tplList=Object.entries(tpls).reverse();
  const box=document.getElementById("savedList");
  if(!tplList.length){box.innerHTML='<div class="empty">まだ保存した組み合わせはありません。<br>「つくる」で選んで、下の欄から保存してね。</div>';return;}
  box.innerHTML=tplList.map(([name,t],i)=>{
    const labels=tagLabels(t);const shown=labels.slice(0,14);
    const chips=shown.map(l=>`<span class="chip">${escHtml(l)}</span>`).join("")+(labels.length>shown.length?`<span class="chip">+${labels.length-shown.length}</span>`:"");
    const date=t.saved?new Date(t.saved).toLocaleDateString("ja-JP"):"";
    return `<div class="saved-item"><div class="saved-top"><strong>${escHtml(name)}</strong><span class="muted" style="margin:0">${date}</span></div><div class="chips" style="margin:0">${chips||'<span class="muted">（空）</span>'}</div><div class="saved-actions"><button class="mini accent" onclick="loadTemplate(${i})">読み込む</button><button class="mini" onclick="copyTemplate(${i})">コピー</button><button class="mini" onclick="renameTemplate(${i})">名前変更</button><button class="mini" onclick="deleteTemplate(${i})">削除</button></div></div>`;
  }).join("");
}
function loadTemplate(i){
  const t=tplList[i]&&tplList[i][1];if(!t)return;
  selectedStyles=new Set((t.styles||[]).filter(n=>DATA["方向性"].some(x=>x[0]===n)));selected=new Set(t.items||[]);
  characterType=CHARACTER_PROMPTS[t.character]?t.character:null;
  Object.keys(PERSON).forEach(g=>psel[g]=new Set(validP(g,t.hair&&t.hair[g])));
  manual=false;showView("make");render();
  if(t.custom){const out=document.getElementById("output");out.value=t.custom;manual=(t.custom.trim()!==lastAuto.join(", "));updateManualUI();}
  showToast("読み込んだよ！");
}
async function copyTemplate(i){
  const t=tplList[i]&&tplList[i][1];if(!t)return;
  showToast(await copyText(t.custom||buildTags(t).join(", "))?"コピーしたよ！":"コピーできなかった…");
}
function renameTemplate(i){
  const old=tplList[i]&&tplList[i][0];if(!old)return;
  const nn=(prompt("新しい名前",old)||"").trim();if(!nn||nn===old)return;
  const tpls=getTpls();
  if(tpls[nn]&&!confirm(`「${nn}」は保存済みです。上書きしますか？`))return;
  const t=tpls[old];delete tpls[old];delete tpls[nn];tpls[nn]=t;
  if(setTpls(tpls)){renderSaved();updateSavedCount();}
}
function deleteTemplate(i){
  const name=tplList[i]&&tplList[i][0];if(!name)return;
  if(!confirm(`「${name}」を削除しますか？`))return;
  const tpls=getTpls();delete tpls[name];
  if(setTpls(tpls)){renderSaved();updateSavedCount();showToast("削除したよ");}
}
async function exportTemplates(){
  const text=JSON.stringify(getTpls());
  document.getElementById("backup").value=text;
  showToast(await copyText(text)?"書き出してコピーしたよ！":"書き出したよ（手動でコピーしてね）");
}
function importTemplates(){
  const raw=document.getElementById("backup").value.trim();if(!raw){showToast("テキストを貼り付けてね");return;}
  let obj;try{obj=JSON.parse(raw);}catch(e){showToast("読み込めない形式です");return;}
  if(!obj||typeof obj!=="object"||Array.isArray(obj)){showToast("読み込めない形式です");return;}
  const tpls=getTpls();let n=0;
  for(const [k,v] of Object.entries(obj)){if(v&&typeof v==="object"){delete tpls[k];tpls[k]=v;n++;}}
  if(setTpls(tpls)){renderSaved();updateSavedCount();showToast(`${n}件取り込んだよ！`);}
}

document.getElementById("search").addEventListener("input",render);
document.getElementById("output").addEventListener("input",e=>{manual=(e.target.value.trim()!==lastAuto.join(", "));updateManualUI();});
render();
</script></body></html>
