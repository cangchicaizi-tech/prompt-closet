<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt Closet</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
main{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0000000d}
h1{margin:0 0 4px;font-size:25px}h2{font-size:17px;margin:0 0 11px}.sub{font-size:13px;color:#666}
input,textarea{width:100%;padding:11px;border:1px solid #d5d5d8;border-radius:10px;font-size:16px;background:#fff}
.grid{display:flex;flex-wrap:wrap;gap:8px}.btn,.style{padding:9px 12px;border:1px solid #d7d7da;border-radius:10px;background:#fff;font-size:14px}.btn.on,.style.on{background:#222;color:#fff;border-color:#222}
.stylebox{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.stylebox::-webkit-scrollbar{display:none}.style{font-weight:600;white-space:nowrap}.style-elements{margin-top:12px}.muted{font-size:12px;color:#777}
textarea{min-height:100px;font-family:ui-monospace,SFMono-Regular,monospace}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}button{cursor:pointer}
.primary,.danger{padding:10px 14px;border-radius:10px;font-size:14px}.primary{background:#222;color:#fff;border:1px solid #222}.danger{background:#fff;border:1px solid #ccc}
.template-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}.cat-tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.cat-tabs::-webkit-scrollbar{display:none}.cat-tab{flex:0 0 auto;padding:9px 12px;border:1px solid #d7d7da;border-radius:10px;background:#fff;font-size:14px;white-space:nowrap}.cat-tab.on{background:#222;color:#fff;border-color:#222}.shufflebar{display:flex;gap:8px;align-items:center;justify-content:space-between}.shuffle-note{font-size:12px;color:#777}

.character-row{display:flex;gap:8px}.character-btn{padding:9px 14px;border:1px solid #d7d7da;border-radius:10px;background:#fff;font-size:14px}.character-btn.on{background:#222;color:#fff;border-color:#222}
.accordion{display:flex;flex-direction:column;gap:8px}.acc-section{border:1px solid #e4e4e7;border-radius:12px;overflow:hidden;background:#fff}.acc-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:0;background:#fafafa;font-size:15px;font-weight:600;text-align:left}.acc-head.on{background:#222;color:#fff}.acc-body{padding:12px}.acc-count{font-size:12px;font-weight:400;opacity:.7;margin-left:6px}

.category-menu-wrap{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;margin:0 0 10px}
.category-menu{display:inline-flex;gap:8px;min-width:max-content}
.category-menu button{white-space:nowrap}
.category-panel{display:none}
.category-panel.open{display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#222;color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:9999;box-shadow:0 4px 14px #0002}.toast.show{opacity:1;transform:translate(-50%,0)}


.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.cardhead h2{margin:0}
.mini{padding:7px 11px;border:1px solid #d7d7da;border-radius:10px;background:#fff;font-size:13px}
.hair-group{margin-top:14px}.hair-label{font-size:13px;font-weight:600;margin-bottom:6px}.hair-label .muted{margin-left:8px;font-weight:400}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid #0003}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{padding:5px 10px;border:1px solid #d7d7da;border-radius:999px;background:#f6f6f8;font-size:12px}.chip.hairchip{background:#fff3e6;border-color:#f0cfa8}

:root{--ink:#1e1b2e;--sub:#7a7585;--line:#e6dfd6;--ac1:#4b3f7a;--ac2:#b0688f;--grad:linear-gradient(135deg,var(--ac1),var(--ac2))}
body{background:radial-gradient(900px 500px at 0% -10%,#ece3f6 0,transparent 60%),radial-gradient(800px 480px at 100% 0,#fbe6df 0,transparent 55%),#f6f3ef;background-attachment:fixed;color:var(--ink);letter-spacing:.01em}
main{padding:22px 16px 80px}
.card{background:#ffffffe6;border:1px solid #fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 10px 32px #4b3f7a14}
main>.card:first-child{background:var(--grad);color:#fff;padding:22px 20px;box-shadow:0 14px 36px #4b3f7a40}
main>.card:first-child .sub{color:#ffffffcc}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:30px;font-weight:600;letter-spacing:.06em}
h2{display:flex;align-items:center;gap:8px;font-size:15px;letter-spacing:.06em}
h2::before{content:"";width:5px;height:16px;border-radius:3px;background:var(--grad)}
.sub,.muted,.shuffle-note{color:var(--sub)}
.muted{margin:2px 0 8px}
input,textarea{border:1px solid var(--line);border-radius:14px;background:#fffdfb;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{outline:none;border-color:var(--ac2);box-shadow:0 0 0 4px #b0688f22}
textarea{min-height:120px;font-size:13px;line-height:1.55}
.btn,.style,.cat-tab,.character-btn,.mini,.chip,.template-row button{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);transition:all .15s ease}
.btn:hover,.style:hover,.cat-tab:hover,.character-btn:hover,.mini:hover{border-color:var(--ac2)}
.btn.on,.style.on,.cat-tab.on,.character-btn.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 5px 14px #4b3f7a40}
button:active{transform:scale(.96)}
.character-btn{padding:10px 22px;font-weight:600}
.primary{background:var(--grad);border:0;border-radius:999px;padding:11px 20px;font-weight:600;box-shadow:0 6px 16px #4b3f7a40}
.danger{border-radius:999px;border:1px solid var(--line);color:var(--sub)}
.shufflebar .primary{white-space:nowrap}
.acc-head.on{background:var(--grad)}
.hair-menu-wrap{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;margin:8px 0 10px;scrollbar-width:none}.hair-menu-wrap::-webkit-scrollbar{display:none}
.category-menu-wrap{scrollbar-width:none}.category-menu-wrap::-webkit-scrollbar{display:none}
.category-panel.open{animation:fade .18s ease}@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.badge{display:inline-block;min-width:18px;margin-left:7px;padding:1px 6px;border-radius:999px;background:var(--grad);color:#fff;font-size:11px;line-height:16px}
.cat-tab.on .badge{background:#ffffff40}
.chip.hairchip{background:#f7ecf2;border-color:#ecc9db}
.chip{background:#f4f1fa;border-color:#e0d9f0}
.template-row{padding:10px 0}.template-row span{flex:1;font-weight:600}.template-row button{padding:6px 12px;margin-left:6px;font-size:13px}
.toast{background:var(--grad);box-shadow:0 8px 22px #4b3f7a55}
</style></head><body><main>
<div class="card"><h1>Prompt Closet</h1><div class="sub">服・方向性・ポーズを選んで、コピペ用プロンプトを作成</div></div>
<div class="card"><input id="search" placeholder="登録プロンプトを検索…"></div>
<div class="card"><div class="shufflebar"><div><h2 style="margin-bottom:3px">おまかせコーデ</h2><div class="shuffle-note">アウター・トップス・ボトムス・小物から組み合わせ。セット服と方向性は除外。</div></div><button class="primary" onclick="shuffleOutfit()">🎲 シャッフル</button></div></div><div class="card"><h2>人物</h2><div id="characterType" class="character-row"><button class="character-btn" data-value="male" onclick="setCharacter('male')">男性</button><button class="character-btn" data-value="female" onclick="setCharacter('female')">女性</button></div></div><div id="styleCard" class="card"><h2>方向性</h2><div id="styles" class="stylebox"></div><div id="styleElements" class="style-elements"></div></div>
<div id="hairCard" class="card"><div class="cardhead"><h2>髪型・髪色</h2><div class="actions" style="margin:0"><button class="mini" onclick="randomHair()">🎲 ランダム</button><button class="mini" onclick="clearHair()">髪をクリア</button></div></div><div id="hairBody"></div></div>
<div id="categories"></div>
<div class="card"><h2>生成プロンプト</h2><div id="chips" class="chips"></div><textarea id="output" readonly></textarea><div class="actions"><button class="primary" onclick="copyPrompt()">コピー</button><button class="danger" onclick="clearAll()">選択をクリア</button></div></div>
<div class="card"><h2>テンプレート保存</h2><input id="tplName" placeholder="テンプレート名"><div class="actions"><button class="primary" onclick="saveTemplate()">保存</button></div><div id="templates"></div></div>
</main><div id="toast" class="toast">コピーしたよ！</div>

const COLORS=[["黒髪","black","#1a1a1a"],["青みがかった黒","blue-black","#1b2233"],["ダークブラウン","dark brown","#4a3022"],["茶髪","brown","#7a5230"],["栗色","chestnut brown","#8b5a3c"],["ハニーブロンド","honey blonde","#d9a441"],["金髪","blonde","#f0d264"],["プラチナブロンド","platinum blonde","#efe6c8"],["ベージュ","beige","#d8c3a5"],["アッシュグレー","ash grey","#9ea3a8"],["銀髪","silver","#c9ccd1"],["白髪","white","#ffffff"],["赤髪","red","#d02a2a"],["ワインレッド","burgundy","#7b1f35"],["オレンジ","orange","#f08a24"],["ピンク","pink","#f49ac1"],["ローズピンク","rose pink","#e0728f"],["紫","purple","#7d4bb5"],["ラベンダー","lavender","#b9a3e3"],["青","blue","#2f6fd6"],["水色","light blue","#8fd0f2"],["紺","navy blue","#1d2d5c"],["ターコイズ","turquoise","#2bb7b3"],["緑","green","#3f9f4f"],["ミントグリーン","mint green","#9be0c1"],["レインボー","rainbow-colored","linear-gradient(90deg,#f44,#fa3,#ee4,#4c6,#4ae,#86d)"]];
const HAIR={
"髪色":COLORS.map(c=>[c[0],c[1]+" hair",c[2]]),
"長さ":[["ベリーショート","very short hair"],["ショート","short hair"],["ボブ","bob cut"],["ミディアム","medium hair"],["セミロング","medium-long hair"],["ロング","long hair"],["超ロング","very long hair"]],
"髪型":[["ストレート","straight hair"],["ウェーブ","wavy hair"],["天然パーマ","curly hair"],["ゆるふわ","soft fluffy hair"],["ボサボサ","messy hair"],["外ハネ","outward-flipped hair"],["内巻き","inward-curled hair"],["ポニーテール","ponytail"],["ローポニー","low ponytail"],["サイドテール","side ponytail"],["ハーフアップ","half-up hairstyle"],["ツインテール","twin tails"],["ツーサイドアップ","two side up"],["三つ編み","braid"],["お団子","hair bun"],["ウルフカット","wolf cut"],["マッシュ","mushroom cut"],["ツーブロック","undercut"],["刈り上げ","shaved sides"],["オールバック","slicked-back hair"],["姫カット","hime cut"],["モヒカン","mohawk"],["坊主","buzz cut"],["ドレッドヘア","dreadlocks"]],
"前髪・分け目":[["ぱっつん前髪","blunt bangs"],["流し前髪","swept bangs"],["シースルーバング","wispy see-through bangs"],["長めの前髪","long bangs"],["アシンメトリー前髪","asymmetrical bangs"],["片目隠れ","hair covering one eye"],["センター分け","center-parted hair"],["七三分け","side-parted hair"],["かき上げ","swept-back hair"],["おでこ出し","forehead visible"],["前髪なし","no bangs"]],

};
const HAIR_SINGLE=new Set(["髪色","長さ","前髪・分け目","差し色"]);
const HAIR_NOTE={"差し色":"メッシュ等の2色目"};
let hair={};Object.keys(HAIR).forEach(k=>hair[k]=new Set());
const JP={};
Object.values(DATA).forEach(a=>a.forEach(x=>{if(!JP[x[1]])JP[x[1]]=x[0]}));
Object.values(STYLES).forEach(a=>a.forEach(x=>{if(!JP[x[1]])JP[x[1]]=x[0]}));
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function toggleHair(g,en){
  const set=hair[g];
  if(set.has(en))set.delete(en);
  else{if(HAIR_SINGLE.has(g))set.clear();set.add(en);}
  render();
}
function clearHair(){Object.keys(HAIR).forEach(g=>hair[g].clear());render();}
function randomHair(){
  clearHair();
  hair["髪色"].add(pick(HAIR["髪色"])[1]);
  hair["長さ"].add(pick(HAIR["長さ"])[1]);
  hair["髪型"].add(pick(HAIR["髪型"])[1]);
  if(Math.random()<.6)hair["前髪・分け目"].add(pick(HAIR["前髪・分け目"])[1]);
  render();
}
let openHair=null;
function toggleHairTab(g){openHair=(openHair===g)?null:g;render();}
function renderHair(q){
  const box=document.getElementById("hairBody");
  const old=box.querySelector(".hair-menu-wrap");const sc=old?old.scrollLeft:0;
  const keys=Object.keys(HAIR);
  const menu=keys.map(g=>{const n=hair[g].size;return `<button class="cat-tab ${openHair===g?"on":""}" onclick="toggleHairTab('${esc(g)}')">${g}${n?`<span class="badge">${n}</span>`:""}</button>`}).join("");
  const panels=keys.map(g=>{
    const arr=HAIR[g].filter(x=>!q||x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));
    const btns=arr.map(x=>{
      const dot=x[2]?`<span class="dot" style="background:${x[2]}"></span>`:"";
      return `<button class="btn ${hair[g].has(x[1])?"on":""}" onclick="toggleHair('${esc(g)}','${esc(x[1])}')">${dot}${x[0]}</button>`;
    }).join("");
    return `<div class="category-panel ${openHair===g?"open":""}"><div class="muted">${g} · ${HAIR_NOTE[g]||(HAIR_SINGLE.has(g)?"1つ選択":"複数OK")} · ${arr.length}件</div><div class="grid">${btns}</div></div>`;
  }).join("");
  box.innerHTML=`<div class="hair-menu-wrap"><div class="category-menu">${menu}</div></div>${panels}`;
  const nw=box.querySelector(".hair-menu-wrap");if(nw)nw.scrollLeft=sc;
}
function renderChips(){
  const box=document.getElementById("chips");if(!box)return;
  let h="";
  for(const g of Object.keys(HAIR))for(const en of hair[g]){
    const it=HAIR[g].find(x=>x[1]===en);
    h+=`<button class="chip hairchip" onclick="toggleHair('${esc(g)}','${esc(en)}')">${g==="差し色"?"差し色:":""}${it?it[0]:en} ×</button>`;
  }
  for(const en of selected)h+=`<button class="chip" onclick="toggle('${esc(en)}')">${JP[en]||en} ×</button>`;
  box.innerHTML=h||'<span class="muted">未選択</span>';
}

let selected = new Set();
let selectedStyles = new Set();
let activeCategory = null;
let characterType = null;

const CHARACTER_PROMPTS = {
  male: "1boy, solo male, adult male",
  female: "1girl"
};
const BASE_PROMPT = "masterpiece, best quality, highly detailed, clean illustration, detailed face, detailed facial features, natural proportions, coherent details";
const SHUFFLE_CATS = ["アウター", "トップス", "ボトムス", "小物"];
const SHUFFLE_COUNTS = {"アウター":1, "トップス":1, "ボトムス":1, "小物":2};
const esc = s => String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'");

function button(jp,en){
  return `<button class="btn ${selected.has(en)?"on":""}" onclick="toggle('${esc(en)}')">${jp}</button>`;
}
function setCharacter(type){
  characterType=type;
  document.querySelectorAll("#characterType .character-btn").forEach(b=>b.classList.toggle("on",b.dataset.value===type));
  update();
}
let openCategory = null;
function toggleCategory(cat){
  openCategory = (openCategory === cat) ? null : cat;
  render();
}
function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function shuffleOutfit(){
  selected.clear();
  for(const cat of SHUFFLE_CATS){
    let pool=DATA[cat]||[];
    if(cat==="小物") pool=pool.filter(x=>!["guitar","cake","parfait"].includes(x[1]));
    shuffleArray(pool).slice(0,SHUFFLE_COUNTS[cat]||1).forEach(x=>selected.add(x[1]));
  }
  render();
}
function toggle(en){
  if(selected.has(en)) selected.delete(en); else selected.add(en);
  render();
}
function toggleStyle(style){
  if(selectedStyles.has(style)){
    selectedStyles.delete(style);
    (STYLES[style]||[]).forEach(x=>selected.delete(x[1]));
  }else{
    selectedStyles.add(style);
    (STYLES[style]||[]).forEach(x=>selected.add(x[1]));
  }
  render();
}
function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();

  const styleBox=document.getElementById("styles");
  const styleScroll=styleBox ? styleBox.scrollLeft : 0;
  document.getElementById("styles").innerHTML = DATA["方向性"]
    .filter(x => !q || x[0].toLowerCase().includes(q) || x[1].toLowerCase().includes(q))
    .map(x => `<button class="style ${selectedStyles.has(x[0]) ? "on" : ""}" onclick="toggleStyle('${esc(x[0])}')">${x[0]}</button>`)
    .join("");
  if(styleBox)styleBox.scrollLeft=styleScroll;

  const cats = Object.keys(DATA).filter(cat => cat !== "方向性");
  const menuWrap=document.querySelector(".category-menu-wrap");
  const menuScroll=menuWrap ? menuWrap.scrollLeft : 0;
  const openCats = new Set(openCategory ? [openCategory] : []);

  const menu = cats.map(cat =>
    `<button class="cat-tab ${openCats.has(cat) ? "on" : ""}" data-category="${esc(cat)}" onclick="toggleCategory('${esc(cat)}')">${cat}${(()=>{const n=(DATA[cat]||[]).filter(x=>selected.has(x[1])).length;return n?`<span class="badge">${n}</span>`:""})()}</button>`
  ).join("");
  const panels = cats.map(cat => {
    let arr = DATA[cat] || [];
    if(q)arr=arr.filter(x=>x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));
    return `<div class="category-panel ${openCats.has(cat)?"open":""}" data-category="${esc(cat)}">
      <div class="muted">${cat} · ${arr.length}件</div>
      <div class="grid">${arr.map(x=>button(x[0],x[1])).join("")}</div>
    </div>`;
  }).join("");

  document.getElementById("categories").innerHTML=`<div class="card"><div class="category-menu-wrap"><div class="category-menu">${menu}</div></div>${panels}</div>`;
  const newMenuWrap=document.querySelector(".category-menu-wrap");
  if(newMenuWrap)newMenuWrap.scrollLeft=menuScroll;

  let styleHtml="";
  for(const style of selectedStyles){
    const arr2=(STYLES[style]||[]).filter(x=>!q||x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));
    styleHtml+=`<div class="style-group"><strong>${style} の要素</strong><div class="grid">${arr2.map(x=>button(x[0],x[1])).join("")}</div></div>`;
  }
  document.getElementById("styleElements").innerHTML=styleHtml;

  document.querySelectorAll("#characterType .character-btn").forEach(b=>b.classList.toggle("on",b.dataset.value===characterType));
  renderHair(q);
  update();
  showTemplates();
}

function update(){
  const styles=[...selectedStyles].map(s=>(DATA["方向性"].find(x=>x[0]===s)||[])[1]).filter(Boolean);
  const base = characterType ? [CHARACTER_PROMPTS[characterType]] : [];
  const quality = characterType ? [BASE_PROMPT] : [];
  const hairParts=Object.keys(HAIR).flatMap(g=>[...hair[g]]);
  document.getElementById("output").value=[...base,...hairParts,...styles,...selected,...quality].join(", ");
  renderChips();
}
async function copyPrompt(){
  const text=document.getElementById("output").value;
  if(!text)return;
  try{await navigator.clipboard.writeText(text);}catch{const out=document.getElementById("output");out.focus();out.select();document.execCommand("copy");}
  const toast=document.getElementById("toast");
  toast.classList.remove("show");
  void toast.offsetWidth;
  toast.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>toast.classList.remove("show"),1400);
}
function clearAll(){
  selected.clear();
  selectedStyles.clear();
  Object.keys(HAIR).forEach(g=>hair[g].clear());
  characterType=null;
  activeCategory=null;
  openCategory=null;
  render();
}
function saveTemplate(){
  const name=document.getElementById("tplName").value.trim(); if(!name)return;
  const templates=JSON.parse(localStorage.getItem("promptClosetTemplates")||"{}");
  templates[name]={styles:[...selectedStyles],items:[...selected],character:characterType,hair:Object.fromEntries(Object.keys(HAIR).map(g=>[g,[...hair[g]]]))};
  localStorage.setItem("promptClosetTemplates",JSON.stringify(templates));
  document.getElementById("tplName").value=""; showTemplates();
}
function loadTemplate(name){
  const templates=JSON.parse(localStorage.getItem("promptClosetTemplates")||"{}"); const t=templates[name]; if(!t)return;
  selectedStyles=new Set(t.styles||[]); selected=new Set(t.items||[]); Object.keys(HAIR).forEach(g=>hair[g]=new Set((t.hair&&t.hair[g])||[])); characterType=(t.character===undefined ? null : t.character); render();
}
function deleteTemplate(name){
  const templates=JSON.parse(localStorage.getItem("promptClosetTemplates")||"{}"); delete templates[name]; localStorage.setItem("promptClosetTemplates",JSON.stringify(templates)); showTemplates();
}
function showTemplates(){
  const box=document.getElementById("templates"); if(!box)return;
  const templates=JSON.parse(localStorage.getItem("promptClosetTemplates")||"{}");
  box.innerHTML=Object.keys(templates).map(name=>`<div class="template-row"><span>${name}</span><button onclick="loadTemplate('${esc(name)}')">読み込む</button><button onclick="deleteTemplate('${esc(name)}')">削除</button></div>`).join("");
}
document.getElementById("search").addEventListener("input",render);
render();
</script></body></html>
