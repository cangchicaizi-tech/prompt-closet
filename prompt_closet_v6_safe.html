let openCategory = "アウター";

};
const BASE_PROMPT = "masterpiece, best quality, highly detailed, clean illustration, detailed face, detailed facial features, well-drawn hands, anatomically correct hands, correct anatomy, natural proportions, coherent details";
const SHUFFLE_CATS = ["アウター", "トップス", "ボトムス", "小物"];
const SHUFFLE_COUNTS = {"アウター":1, "トップス":1, "ボトムス":1, "小物":2};
const esc = s => String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'");

function button(jp,en){
  return `<button class="btn ${selected.has(en)?"on":""}" onclick="toggle('${esc(en)}')">${jp}</button>`;
}
function setCharacter(type){
  characterType=type;
  document.querySelectorAll("#characterType .character-btn").forEach(b=>b.classList.toggle("on",b.dataset.value===type));
  update();
}
function toggleCategory(cat){
  openCategory = openCategory === cat ? null : cat;
  renderCategories();
}
function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function shuffleOutfit(){
  selected.clear();
  for(const cat of SHUFFLE_CATS){
    let pool=DATA[cat]||[];
    if(cat==="小物") pool=pool.filter(x=>!["guitar","cake","parfait"].includes(x[1]));
    shuffleArray(pool).slice(0,SHUFFLE_COUNTS[cat]||1).forEach(x=>selected.add(x[1]));
  }
  renderCategories();
  update();
}
function toggle(en){
  if(selected.has(en)) selected.delete(en); else selected.add(en);
  renderCategories();
  update();
}
function toggleStyle(style){
  if(selectedStyles.has(style)){
    selectedStyles.delete(style);
    (STYLES[style]||[]).forEach(x=>selected.delete(x[1]));
  }else{
    selectedStyles.add(style);
    (STYLES[style]||[]).forEach(x=>selected.add(x[1]));
  }
  render();
}

  const q=document.getElementById("search").value.trim().toLowerCase();
  document.getElementById("styles").innerHTML=(DATA["方向性"]||[])
    .filter(x=>!q||x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q))
    .map(x=>`<button class="style ${selectedStyles.has(x[0])?"on":""}" onclick="toggleStyle('${esc(x[0])}')">${x[0]}</button>`).join("");
  if(box) box.scrollLeft=scrollLeft;
  let styleHtml="";
  for(const style of selectedStyles){
    const arr=(STYLES[style]||[]).filter(x=>!q||x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));
    styleHtml+=`<div class="style-group"><strong>${style} の要素</strong><div class="grid">${arr.map(x=>button(x[0],x[1])).join("")}</div></div>`;
  }
  document.getElementById("styleElements").innerHTML=styleHtml;
}
function renderCategories(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const cats=Object.keys(DATA).filter(c=>c!=="方向性");
  const html=cats.map(cat=>{
    const arr=(DATA[cat]||[]).filter(x=>!q||x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));
    const open=openCategory===cat;
    return `<div class="acc-section">
      <button class="acc-head ${open?"on":""}" onclick="toggleCategory('${esc(cat)}')"><span>${cat}<span class="acc-count">${arr.length}件</span></span><span>${open?"−":"＋"}</span></button>
      ${open?`<div class="acc-body"><div class="grid">${arr.map(x=>button(x[0],x[1])).join("")}</div></div>`:""}
    </div>`;
  }).join("");
  document.getElementById("categories").innerHTML=`<div class="card"><h2>アイテム</h2><div class="accordion">${html}</div></div>`;
}
function render(){
  renderStyles();
  renderCategories();
  document.querySelectorAll("#characterType .character-btn").forEach(b=>b.classList.toggle("on",b.dataset.value===characterType));
  update();
  showTemplates();
}
function update(){
  const styles=[...selectedStyles].map(s=>(DATA["方向性"].find(x=>x[0]===s)||[])[1]).filter(Boolean);
  document.getElementById("output").value=[CHARACTER_PROMPTS[characterType],BASE_PROMPT,...styles,...selected].join(", ");
}
async function copyPrompt(){
  const text=document.getElementById("output").value;
  try{await navigator.clipboard.writeText(text);}catch{const out=document.getElementById("output");out.focus();out.select();document.execCommand("copy");}
}
function clearAll(){selected.clear();selectedStyles.clear();render();}
function saveTemplate(){
  const name=document.getElementById("tplName").value.trim(); if(!name)return;
  const templates=JSON.parse(localStorage.getItem("promptClosetTemplates")||"{}");
  templates[name]={styles:[...selectedStyles],items:[...selected],character:characterType};
  localStorage.setItem("promptClosetTemplates",JSON.stringify(templates));
  document.getElementById("tplName").value=""; showTemplates();
}
function loadTemplate(name){
  const templates=JSON.parse(localStorage.getItem("promptClosetTemplates")||"{}"); const t=templates[name]; if(!t)return;
  selectedStyles=new Set(t.styles||[]); selected=new Set(t.items||[]); characterType=t.character||"male"; render();
}
function deleteTemplate(name){
  const templates=JSON.parse(localStorage.getItem("promptClosetTemplates")||"{}"); delete templates[name]; localStorage.setItem("promptClosetTemplates",JSON.stringify(templates)); showTemplates();
}
function showTemplates(){
  const box=document.getElementById("templates"); if(!box)return;
  const templates=JSON.parse(localStorage.getItem("promptClosetTemplates")||"{}");
  box.innerHTML=Object.keys(templates).map(name=>`<div class="template-row"><span>${name}</span><button onclick="loadTemplate('${esc(name)}')">読み込む</button><button onclick="deleteTemplate('${esc(name)}')">削除</button></div>`).join("");
}
document.getElementById("search").addEventListener("input",render);
render();
</script></body></html>
